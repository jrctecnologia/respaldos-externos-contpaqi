# Publica una versión: git tag v1.2.3 && git push origin v1.2.3
name: Publicar versión
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Probar
        run: dotnet test RespaldosBak.Tests
        env:
          RESPALDOS_PRUEBA_4GB: "1"
      - name: Compilar
        run: dotnet build RespaldosBak -c Release -p:Version="${GITHUB_REF_NAME#v}"
      - name: Calcular SHA-256
        working-directory: RespaldosBak/bin/Release/net48
        run: sha256sum RespaldosBak.exe > RespaldosBak.exe.sha256
      - name: Crear la versión en GitHub
        working-directory: RespaldosBak/bin/Release/net48
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Las versiones con guion (v1.0.0-beta1) se marcan como preliminares.
          extra=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && extra+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" RespaldosBak.exe RespaldosBak.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Respaldos BAK $GITHUB_REF_NAME" --generate-notes "${extra[@]}"
