name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar (.NET Framework 4.8)
        run: dotnet build RespaldosBak -c Release
      - name: Probar (net48 y net10.0)
        run: dotnet test RespaldosBak.Tests
        env:
          RESPALDOS_PRUEBA_4GB: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: RespaldosBak
          path: RespaldosBak/bin/Release/net48/RespaldosBak.exe
          if-no-files-found: error
